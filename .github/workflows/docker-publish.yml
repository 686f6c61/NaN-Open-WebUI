name: Publicar imagen Docker (GHCR)

# Construye la imagen multiplataforma (amd64 + arm64) y la publica en GitHub
# Packages (GHCR). No contiene ningun secreto: la API key es del usuario final y
# se inyecta en tiempo de ejecucion.
#   - Etiqueta vX.Y.Z  -> tags vX.Y.Z y latest, y release de GitHub con su CHANGELOG
#   - Push a main      -> tags main y sha-<commit> (latest queda en la ultima release)
#   - Pull request     -> solo construye y prueba, no publica
# Antes de publicar, el job smoke-test construye la imagen (amd64), levanta el
# stack completo y comprueba que arranca bien configurado (.github/scripts/smoke-test.sh).
# Las acciones van fijadas por SHA para que un tag movido no cambie lo que se ejecuta.

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build (amd64, local)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: nan-open-webui:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Prueba de humo
        run: .github/scripts/smoke-test.sh nan-open-webui:ci

  build-and-push:
    needs: smoke-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: QEMU (arm64)
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login en GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadatos de la imagen
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/nan-open-webui
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=branch
            type=sha

      - name: Build y push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Release de GitHub con la seccion de la version del CHANGELOG. Solo con etiquetas
  # vX.Y.Z y solo si la imagen se ha publicado bien.
  release:
    needs: build-and-push
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Notas desde el CHANGELOG
        id: notas
        env:
          TAG: ${{ github.ref_name }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/nan-open-webui
        run: |
          set -euo pipefail
          # Cabecera "## vX.Y.Z - fecha - titulo": el titulo de la release es lo que va
          # tras la version; el cuerpo, todo hasta la siguiente version.
          header="$(grep -m1 "^## ${TAG} " CHANGELOG.md || true)"
          [ -n "$header" ] || { echo "No hay seccion ${TAG} en CHANGELOG.md" >&2; exit 1; }
          echo "title=${header#'## '}" >> "$GITHUB_OUTPUT"
          {
            echo "Imagen: \`${IMAGE}:${TAG}\` (amd64 y arm64)"
            echo
            echo '```bash'
            echo "docker pull ${IMAGE}:${TAG}"
            echo '```'
            echo
            awk -v tag="$TAG" '
              $0 ~ "^## " tag " " { dentro = 1; next }
              dentro && /^## v/ { exit }
              dentro { print }
            ' CHANGELOG.md
          } > notas.md

      - name: Crear la release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          TITLE: ${{ steps.notas.outputs.title }}
        run: gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TITLE" --notes-file notas.md --verify-tag
