# nan-open-webui — levanta tu propia Open WebUI conectada a NaN.
#
#   1) ./setup.sh                 (crea .env y genera los secretos locales)
#   2) edita .env -> NAN_API_KEY  (tu key de https://nan.builders)
#   3) docker compose up -d
#   4) abre http://localhost:3000 (o el WEBUI_PORT que elijas)

services:
  nan-open-webui:
    # Imagen de Open WebUI preconfigurada para NaN, publicada en GHCR.
    # Es publica y NO contiene ningun secreto: la API key se inyecta solo
    # en runtime desde .env. Va fijada por tag para que actualizar sea una
    # decision deliberada (cambia OPENWEBUI_IMAGE en .env); asi un reinicio
    # normal nunca trae una version nueva con migraciones de datos.
    image: ${OPENWEBUI_IMAGE:-ghcr.io/686f6c61/nan-open-webui:v1.0.0}
    container_name: nan-open-webui
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      # --- Conexion a NaN (OpenAI-compatible) ---
      - ENABLE_OPENAI_API=true
      - OPENAI_API_BASE_URL=${OPENAI_API_BASE_URL:-https://api.nan.builders/v1}
      # La API key NUNCA se escribe aqui: viene de .env. Si falta, compose para con un aviso claro.
      - OPENAI_API_KEY=${NAN_API_KEY:?Falta NAN_API_KEY -> copia .env.example a .env y pon tu key}
      # Lista de modelos de chat visibles. Deja fuera los de imagen/audio/embeddings/rerank.
      - 'OPENAI_API_CONFIGS=${OPENAI_API_CONFIGS:-}'
      # Modelo seleccionado en los chats nuevos.
      - DEFAULT_MODELS=${DEFAULT_MODELS:-deepseek-v4-flash}
      # Parametros por defecto de todos los modelos (function calling, razonamiento...).
      - 'DEFAULT_MODEL_PARAMS=${DEFAULT_MODEL_PARAMS:-}'
      # Capacidades por defecto de todos los modelos. 'usage' hace que Open WebUI pida a
      # NaN el recuento de tokens: sin ella, Admin > Analiticas muestra 0 tokens.
      # 'builtinTools' apaga herramientas integradas poco usadas (calendario, automatizaciones,
      # tareas, notas, canales): son ~10.000 caracteres en cada mensaje. Las skills
      # siguen activas: sin ninguna seleccionada solo anaden create_skill a los admins.
      - 'DEFAULT_MODEL_METADATA=${DEFAULT_MODEL_METADATA:-{"terminalId":"open-terminal","defaultFeatureIds":["web_search","image_generation"],"capabilities":{"file_context":true,"vision":true,"file_upload":true,"web_search":true,"image_generation":true,"code_interpreter":true,"terminal":true,"citations":true,"status_updates":true,"usage":true,"memory":true,"builtin_tools":true},"builtinTools":{"calendar":false,"automations":false,"tasks":false,"notes":false,"channels":false}}}'
      # Tool Search (experimental en Open WebUI): las herramientas largas se envian solo
      # por nombre y el modelo las carga cuando las necesita. Junto con lo anterior,
      # un 77 % menos de tokens por mensaje (medido). 'false' para desactivarla.
      - ENABLE_TOOL_SEARCH=${ENABLE_TOOL_SEARCH:-true}
      # Herramientas que nunca se aplazan: con qwen3.8-flash, usarlas a traves de call_tool
      # fallaba (11 llamadas rotas en una presentacion). Solo cuestan tokens cuando el
      # terminal o esas integraciones estan activos.
      - TOOL_SEARCH_ALWAYS_LOADED=${TOOL_SEARCH_ALWAYS_LOADED:-run_command,get_process_status,read_file,write_file,replace_file_content,display_file,list_files,view_skill,read_skill_file,search_web,fetch_url,generate_image,edit_image}
      # Limite de caracteres de cada pagina que lee el modelo al buscar en internet.
      # Vacio = sin limite (una pagina puede meter ~80.000 caracteres en el contexto).
      - WEB_FETCH_MAX_CONTENT_LENGTH=${WEB_FETCH_MAX_CONTENT_LENGTH:-}
      # --- Sin modelos locales (solo NaN) ---
      - ENABLE_OLLAMA_API=false
      # --- Sesion e interfaz ---
      - WEBUI_AUTH=true
      - WEBUI_NAME=${WEBUI_NAME:-NaN Chat}
      # Logo de la comunidad NaN en favicon, barra lateral y pantalla de carga. La licencia
      # de Open WebUI no permite cambiar su logo con mas de 50 usuarios: entonces, false.
      - NAN_LOGO=${NAN_LOGO:-true}
      # Icono de NaN para quien no tiene foto de perfil (en vez de la silueta gris).
      - NAN_AVATAR=${NAN_AVATAR:-true}
      # Obligatoria: sin ella Open WebUI genera una clave en un fichero fuera del
      # volumen de datos y todas las sesiones caducan al recrear el contenedor.
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY:?Falta WEBUI_SECRET_KEY -> ejecuta ./setup.sh o anadela al .env}
      # URL publica y CORS, relevantes solo detras de un proxy con dominio (PRODUCCION.md)
      - WEBUI_URL=${WEBUI_URL:-}
      - CORS_ALLOW_ORIGIN=${CORS_ALLOW_ORIGIN:-*}
      # No publicar chats en la comunidad de openwebui.com.
      - ENABLE_COMMUNITY_SHARING=false
      # --- Multiusuario ---
      # Registro abierto o cerrado. La primera cuenta creada es siempre la de admin.
      - ENABLE_SIGNUP=${ENABLE_SIGNUP:-false}
      # Los registros nuevos quedan 'pending' hasta que un admin los aprueba.
      - DEFAULT_USER_ROLE=${DEFAULT_USER_ROLE:-pending}
      # Respeta el control de acceso a modelos por grupo (un admin puede
      # restringir modelos concretos a grupos concretos).
      - BYPASS_MODEL_ACCESS_CONTROL=${BYPASS_MODEL_ACCESS_CONTROL:-false}
      # Config persistente: lo cambiado en el panel de admin manda sobre el .env.
      # 'false' hace que el .env sea siempre la fuente de verdad.
      - ENABLE_PERSISTENT_CONFIG=${ENABLE_PERSISTENT_CONFIG:-true}
      # --- Busqueda web (via SearXNG, sin API key). Ponlo en 'false' para desactivarla ---
      - ENABLE_WEB_SEARCH=${ENABLE_WEB_SEARCH:-true}
      - WEB_SEARCH_ENGINE=searxng
      - SEARXNG_QUERY_URL=http://searxng:8080/search?q=<query>
      # --- Voz: salida hablada con 'kokoro' de NaN ---
      - AUDIO_TTS_ENGINE=openai
      - AUDIO_TTS_OPENAI_API_BASE_URL=${OPENAI_API_BASE_URL:-https://api.nan.builders/v1}
      - AUDIO_TTS_OPENAI_API_KEY=${NAN_API_KEY}
      - AUDIO_TTS_MODEL=kokoro
      - AUDIO_TTS_VOICE=${AUDIO_TTS_VOICE:-ef_dora}
      # --- Dictado: vacio = whisper LOCAL del contenedor (sin salir a internet);
      #     'openai' = 'whisper' large-v3 de NaN (mas preciso, 25 MB y ~2 min por audio) ---
      - AUDIO_STT_ENGINE=${AUDIO_STT_ENGINE:-}
      - AUDIO_STT_OPENAI_API_BASE_URL=${OPENAI_API_BASE_URL:-https://api.nan.builders/v1}
      - AUDIO_STT_OPENAI_API_KEY=${NAN_API_KEY}
      - AUDIO_STT_MODEL=${AUDIO_STT_MODEL:-whisper}
      # --- RAG: embeddings con 'qwen3-embedding' y reordenado con 'rerank' de NaN ---
      - RAG_EMBEDDING_ENGINE=openai
      - RAG_OPENAI_API_BASE_URL=${OPENAI_API_BASE_URL:-https://api.nan.builders/v1}
      - RAG_OPENAI_API_KEY=${NAN_API_KEY}
      - RAG_EMBEDDING_MODEL=qwen3-embedding
      # NaN admite lotes de 32 textos y 60 peticiones/min en embeddings: sin esto
      # Open WebUI manda una peticion por fragmento y la busqueda web acaba en 429.
      - RAG_EMBEDDING_BATCH_SIZE=${RAG_EMBEDDING_BATCH_SIZE:-32}
      - RAG_EMBEDDING_CONCURRENT_REQUESTS=${RAG_EMBEDDING_CONCURRENT_REQUESTS:-2}
      # Busqueda hibrida (BM25 + vectores) y reordenado con Qwen3-Reranker-8B.
      - ENABLE_RAG_HYBRID_SEARCH=${ENABLE_RAG_HYBRID_SEARCH:-true}
      - RAG_RERANKING_ENGINE=external
      - RAG_EXTERNAL_RERANKER_URL=${OPENAI_API_BASE_URL:-https://api.nan.builders/v1}/rerank
      - RAG_EXTERNAL_RERANKER_API_KEY=${NAN_API_KEY}
      - RAG_RERANKING_MODEL=rerank
      # --- Imagenes: generacion y edicion con 'flux-2-klein' de NaN ---
      #     Usa la Images API OpenAI-compatible (/v1/images/generations y /v1/images/edits).
      - ENABLE_IMAGE_GENERATION=${ENABLE_IMAGE_GENERATION:-true}
      - ENABLE_IMAGE_PROMPT_GENERATION=${ENABLE_IMAGE_PROMPT_GENERATION:-false}
      - IMAGE_GENERATION_ENGINE=openai
      - IMAGE_GENERATION_MODEL=${IMAGE_GENERATION_MODEL:-qwen-image-2.1}
      - IMAGE_SIZE=${IMAGE_SIZE:-1024x1024}
      - IMAGES_OPENAI_API_BASE_URL=${OPENAI_API_BASE_URL:-https://api.nan.builders/v1}
      - IMAGES_OPENAI_API_KEY=${NAN_API_KEY}
      # Fija el tamano en cada generacion: en modo nativo el modelo propone tamanos
      # (p. ej. 1536x1024) que qwen-image-2.1 rechaza (maximo 1280 px).
      - 'IMAGES_OPENAI_PARAMS=${IMAGES_OPENAI_PARAMS:-{"size":"${IMAGE_SIZE:-1024x1024}"}}'
      - ENABLE_IMAGE_EDIT=${ENABLE_IMAGE_EDIT:-true}
      - IMAGE_EDIT_ENGINE=openai
      - IMAGE_EDIT_MODEL=${IMAGE_EDIT_MODEL:-flux-2-klein}
      - IMAGE_EDIT_SIZE=${IMAGE_EDIT_SIZE:-1024x1024}
      - IMAGES_EDIT_OPENAI_API_BASE_URL=${OPENAI_API_BASE_URL:-https://api.nan.builders/v1}
      - IMAGES_EDIT_OPENAI_API_KEY=${NAN_API_KEY}
      # --- Interprete de codigo: el modelo escribe Python y se ejecuta en el navegador ---
      - ENABLE_CODE_INTERPRETER=true
      - CODE_INTERPRETER_ENGINE=pyodide
      - ENABLE_CODE_EXECUTION=true
      # --- Asistencias de escritura: autocompletado + modelo rapido para titulos/etiquetas/seguimiento ---
      - ENABLE_AUTOCOMPLETE_GENERATION=true
      - TASK_MODEL_EXTERNAL=${TASK_MODEL_EXTERNAL:-deepseek-v4-flash}
      # Sin razonamiento en titulos, etiquetas y sugerencias: medido, 1,5-2,3 s y 12 tokens
      # por titulo, frente a 3,5-6 s y ~160 tokens razonando.
      - 'TASK_MODEL_PARAMS=${TASK_MODEL_PARAMS:-{"reasoning_effort":"none"}}'
      # Orden de los modelos en el selector.
      - 'MODEL_ORDER_LIST=${MODEL_ORDER_LIST:-["deepseek-v4-flash","glm5.3-flash","mimo-v2.6-flash","qwen3.8-flash","gemma4","qwen3.6"]}'
      # Compactacion de contexto: al pasar de 80.000 tokens resume el historial antiguo.
      # Evita que los encargos largos con el terminal acaben en un 524 de NaN.
      - ENABLE_CONTEXT_COMPACTION=${ENABLE_CONTEXT_COMPACTION:-true}
      # PDF: extrae las imagenes para que el OCR lea tambien las paginas escaneadas.
      - PDF_EXTRACT_IMAGES=${PDF_EXTRACT_IMAGES:-true}
      # Plantilla de RAG propia; vacia = la de NaN (branding/rag-template.txt).
      - RAG_TEMPLATE=${RAG_TEMPLATE:-}
      - CONTEXT_COMPACTION_MODEL=${CONTEXT_COMPACTION_MODEL:-deepseek-v4-flash}
      # Permisos de herramientas ("Acceso completo" / "Solicitar aprobacion" en el chat).
      - ENABLE_TOOL_PERMISSIONS=${ENABLE_TOOL_PERMISSIONS:-true}
      # Subagentes: el modelo puede delegar tareas en chats propios con herramientas.
      # Cada subagente consume llamadas adicionales a NaN.
      - ENABLE_SUBAGENTS=${ENABLE_SUBAGENTS:-true}
      - SUBAGENTS_BACKGROUND_ENABLED=${SUBAGENTS_BACKGROUND_ENABLED:-true}
      - SUBAGENTS_MAX_CONCURRENT=${SUBAGENTS_MAX_CONCURRENT:-20}
      - SUBAGENTS_MAX_ASYNC=${SUBAGENTS_MAX_ASYNC:-20}
      - SUBAGENTS_MAX_ITERATIONS=${SUBAGENTS_MAX_ITERATIONS:-30}
      - SUBAGENTS_MAX_OUTPUT=${SUBAGENTS_MAX_OUTPUT:-30000}
      # --- Open Terminal (opcional, perfil 'terminal'): conexion al servicio de abajo.
      #     Vacia ('[]') si no lo usas. Sin permisos explicitos, solo lo usan admins ---
      - 'TERMINAL_SERVER_CONNECTIONS=${TERMINAL_SERVER_CONNECTIONS:-[]}'
    depends_on:
      searxng:
        condition: service_healthy
    ports:
      # Solo accesible desde el propio equipo por defecto. Para compartir en tu
      # red local: WEBUI_BIND=0.0.0.0 en .env. Para internet: proxy con HTTPS.
      - "${WEBUI_BIND:-127.0.0.1}:${WEBUI_PORT:-3000}:8080"
    volumes:
      # Datos persistentes (cuentas, chats, ajustes). Sobrevive a reinicios y updates.
      - nan-open-webui-data:/app/backend/data
    networks:
      - nan-open-webui-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 4g

  # Metabuscador autoalojado para la busqueda web: gratis, privado, SIN API key.
  # Usa SEARXNG_SECRET desde .env para no versionar secretos compartidos.
  # No publica puertos: solo es alcanzable desde la red interna de compose.
  # Fijado por tag (SearXNG publica uno por fecha); para actualizar, cambia
  # SEARXNG_IMAGE en .env.
  searxng:
    image: ${SEARXNG_IMAGE:-searxng/searxng:2026.10.16-8252c0bf6}
    container_name: nan-searxng
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    environment:
      - "SEARXNG_SECRET=${SEARXNG_SECRET:?Falta SEARXNG_SECRET -> ejecuta ./setup.sh o anadela al .env}"
    volumes:
      - ./searxng:/etc/searxng:rw
    networks:
      - nan-open-webui-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 1g

  # Open Terminal (https://github.com/open-webui/open-terminal): terminal y
  # navegador de ficheros que el modelo puede usar como herramienta. OPCIONAL:
  # solo arranca con COMPOSE_PROFILES=terminal en el .env. Sin puertos publicados:
  # solo se alcanza desde Open WebUI como http://open-terminal:8000.
  # Es una shell real dentro del contenedor: no montes nunca el socket de Docker.
  # Sin no-new-privileges: la imagen usa sudo en su arranque y para instalar paquetes.
  open-terminal:
    image: ${OPEN_TERMINAL_IMAGE:-ghcr.io/open-webui/open-terminal:0.14.1}
    container_name: nan-open-terminal
    profiles: ["terminal"]
    restart: unless-stopped
    environment:
      - OPEN_TERMINAL_API_KEY=${OPEN_TERMINAL_API_KEY:-}
      # Paquetes que se instalan en cada arranque (separados por espacios). Lo que
      # el modelo instale con pip queda en el volumen; lo de apt se pierde al recrear.
      - OPEN_TERMINAL_PACKAGES=${OPEN_TERMINAL_PACKAGES:-chromium fonts-liberation2 fonts-noto-core}
      - OPEN_TERMINAL_PIP_PACKAGES=${OPEN_TERMINAL_PIP_PACKAGES:-}
      - OPEN_TERMINAL_NPM_PACKAGES=${OPEN_TERMINAL_NPM_PACKAGES:-pptxgenjs hyperframes@0.8.168}
      # npm -g sin sudo: los paquetes van a la carpeta del usuario (persisten en el
      # volumen) y NODE_PATH permite que los scripts de las skills los importen.
      # Sin esto, Open Terminal falla al instalarlos y el contenedor entra en bucle.
      - NPM_CONFIG_PREFIX=/home/user/.local
      - NODE_PATH=/home/user/.local/lib/node_modules
      # Chromium para las skills que renderizan (webs, presentaciones, video).
      - CHROME_PATH=/usr/local/bin/chromium
      - PUPPETEER_EXECUTABLE_PATH=/usr/local/bin/chromium
      # HyperFrames (video): sus skills ya van en skills/ con la misma version que el CLI
      # de arriba; que no las reinstale en ~/.claude/skills (saldrian duplicadas), sin
      # telemetria y sin consultar versiones nuevas en cada comando.
      - HYPERFRAMES_SKIP_SKILLS=1
      - HYPERFRAMES_NO_UPDATE_CHECK=1
      - HYPERFRAMES_NO_TELEMETRY=1
      - DO_NOT_TRACK=1
      # Archify (diagramas): sin consultar actualizaciones y con el Chromium del terminal.
      - ARCHIFY_UPDATE_CHECK_DISABLED=1
      - ARCHIFY_CHROME=/usr/local/bin/chromium
    volumes:
      - nan-open-terminal-data:/home/user
      # Skills del repo (webs, escritura, presentaciones, Excel), solo lectura.
      - ./skills:/home/user/.agents/skills:ro
      # Envoltorio de Chromium con --no-sandbox (ver terminal/chromium).
      - ./terminal/chromium:/usr/local/bin/chromium:ro
      # Instrucciones que el modelo lee en cada turno: empaquetar entregas en ZIP y
      # explicar como descargarlas (ver terminal/AGENTS.md).
      - ./terminal/AGENTS.md:/home/user/AGENTS.md:ro
    networks:
      - nan-open-webui-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 1g

volumes:
  nan-open-webui-data:
    name: nan-open-webui-data
  nan-open-terminal-data:
    name: nan-open-terminal-data

networks:
  nan-open-webui-network:
    name: nan-open-webui-network
