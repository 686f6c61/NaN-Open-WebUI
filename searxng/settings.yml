# SearXNG para la busqueda web de Open WebUI.
# Activa el formato JSON que Open WebUI consulta y desactiva el limitador.
# La imagen oficial sobrescribe 'ultrasecretkey' con SEARXNG_SECRET.
# No pongas aqui un secreto real: debe vivir solo en .env.

use_default_settings: true

server:
  secret_key: "ultrasecretkey"
  limiter: false
  image_proxy: true

ui:
  static_use_hash: true

search:
  safe_search: 0
  autocomplete: ""
  default_lang: "all"
  formats:
    - html
    - json

# Buscadores web. Ademas de los activos por defecto (Google CSE, Brave, Wikipedia...)
# se activan los que respondieron en las pruebas (octubre 2026). DuckDuckGo se usa
# por su API (d.js, "duckduckgo web"): la variante HTML clasica recibe CAPTCHA casi
# siempre desde IPs domesticas y de servidor, asi que se desactiva.
engines:
  - name: bing
    disabled: false
  - name: yahoo
    disabled: false
  - name: yep
    disabled: false
  - name: duckduckgo web
    disabled: false
  - name: duckduckgo
    disabled: true
